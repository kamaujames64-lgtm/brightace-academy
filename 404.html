<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Page not found | BrightAce Academy</title><style>body{min-height:100vh;display:grid;place-items:center;margin:0;padding:24px;box-sizing:border-box;background:#f4f7fb;color:#10263f;font-family:system-ui,sans-serif}.not-found{max-width:620px;text-align:center;background:#fff;padding:clamp(24px,5vw,48px);border-radius:20px;box-shadow:0 12px 40px rgba(16,38,63,.1)}.code{font-size:clamp(3rem,12vw,6rem);font-weight:900;line-height:1;color:#1769aa;margin:0}.not-found h1{margin:14px 0}.not-found p{line-height:1.65;color:#526579}.not-found a{display:inline-block;margin:8px;padding:13px 20px;border-radius:10px;background:#102f4b;color:#fff;text-decoration:none;font-weight:800}</style></head>
<body><main class="not-found"><p class="code">404</p><h1>This BrightAce page could not be found</h1><p>We are checking whether this link has a common path or letter-case variation. If it cannot be matched, return to the homepage and use the navigation menu.</p><a id="homeLink" href="./index.html">Return to BrightAce Academy</a></main><script>
(function(){
 var path=location.pathname,pagesAt=path.toLowerCase().indexOf('/pages/'),base=pagesAt>=0?path.slice(0,pagesAt+1):path.slice(0,path.lastIndexOf('/')+1);
 var known=['index.html','pages/subjects.html','pages/resources.html','pages/homework-help.html','pages/how-it-works.html','pages/about.html','pages/faq.html','pages/chat.html','pages/contact.html','pages/privacy.html','pages/terms.html'];
 var leaf=decodeURIComponent(path.split('/').pop()||'').toLowerCase();
 var match=known.find(function(x){return x.split('/').pop().toLowerCase()===leaf;});
 var home=base+'index.html';document.getElementById('homeLink').href=home;
 if(match&&leaf){var target=base+match; if(path!==target){location.replace(target+location.search+location.hash);}}
})();
</script></body></html>
