services:
  - type: web
    name: brightace-python-api
    runtime: docker
    dockerfilePath: ./python-service/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
      - key: BRIGHTACE_SERVICE_API_KEY
        sync: false
      - key: MAX_BODY_BYTES
        value: "1048576"
      - key: MAX_INFLIGHT_JOBS
        value: "100"
      - key: JOB_ADMISSION_TIMEOUT_SECONDS
        value: "0.25"
      - key: REDIS_MAX_CONNECTIONS
        value: "100"
