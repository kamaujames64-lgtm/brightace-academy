<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BrightAce Invoice / Receipt</title><link rel="stylesheet" href="../css/style.css"><style>body{background:#f3f6f9}.receipt{width:min(820px,92%);margin:50px auto;background:#fff;border:1px solid #dce6f1;border-radius:20px;padding:30px;box-shadow:0 15px 45px rgba(3,21,47,.1)}.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:2px solid #eef3f7;padding-bottom:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:25px 0}.cell{padding:14px;background:#f8fafc;border-radius:12px}.label{font-size:.75rem;color:#718394;font-weight:800;text-transform:uppercase}.value{font-weight:800;color:#10263f}@media(max-width:600px){.grid{grid-template-columns:1fr}.head{flex-direction:column}}@media print{.no-print{display:none}body{background:#fff}.receipt{box-shadow:none;border:0;margin:0;width:auto}}</style></head><body><main class="receipt"><div class="head"><div><div class="brand"><img src="../assets/brightace-logo.png" alt="BrightAce Academy" style="width:58px;height:58px"><div class="brand-text"><div class="brand-name"><span class="bright">Bright</span><span class="ace">Ace</span></div><div class="brand-sub">ACADEMY</div></div></div><h1 id="title" style="margin-top:20px">Invoice / Receipt</h1></div><button class="btn btn-outline no-print" onclick="window.print()">PRINT / SAVE PDF</button></div><div id="body">Loading…</div></main><footer class="footer"><div class="container"><div><a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms &amp; Conditions</a></div></div></footer><script src="../js/app.js"></script><script>const API="https://script.google.com/macros/s/AKfycbx6--Az56QTjbYLQaFB80qLPnD7AUDm0qoVPMX_mmlK_ttV7n5DTIyDHCEvrH9ZGodH/exec";const id=new URLSearchParams(location.search).get("request");const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));const money=(n,c)=>{try{return new Intl.NumberFormat(undefined,{style:"currency",currency:c||"KES"}).format(Number(n||0))}catch(e){return c+" "+Number(n||0).toFixed(2)}};async function load(){if(!id)return document.getElementById("body").textContent="Payment reference is missing.";try{const r=await fetch(API+"?action=paymentRequest&requestId="+encodeURIComponent(id));const d=await r.json();if(!d.ok)throw Error(d.error);const p=d.request,paid=String(p.status).toUpperCase()==="PAID";document.getElementById("title").textContent=paid?"Payment Receipt":"Payment Invoice";document.getElementById("body").innerHTML=`<div class="grid"><div class="cell"><div class="label">Client</div><div class="value">${esc(p.studentName)}</div></div><div class="cell"><div class="label">Payment code</div><div class="value">${esc(p.requestId)}</div></div><div class="cell"><div class="label">Service</div><div class="value">${esc(p.service)}</div></div><div class="cell"><div class="label">Tutor</div><div class="value">${esc(p.tutor)}</div></div><div class="cell"><div class="label">Amount</div><div class="value">${money(p.amount,p.currency)}</div></div><div class="cell"><div class="label">Status</div><div class="value">${esc(p.status)}</div></div><div class="cell"><div class="label">Delivery deadline</div><div class="value">${esc(p.deliveryDeadline||"As agreed")}</div></div></div><p><strong>BrightAce payment protection:</strong> Pay only through the secure BrightAce payment request. Never send payment directly to a tutor.</p>`}catch(e){document.getElementById("body").textContent=e.message}}load();</script></body></html>
