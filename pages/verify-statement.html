<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Verify BrightAce Statement</title><link rel="stylesheet" href="../css/style.css"><style>.verify-shell{width:min(760px,calc(100% - 30px));margin:50px auto}.verify-card{background:#fff;border:1px solid #dce5ec;border-radius:18px;padding:28px;box-shadow:0 12px 35px rgba(16,38,63,.08)}.status{padding:14px;border-radius:12px;margin:16px 0}.ok{background:#e7f7ee;color:#17653d}.bad{background:#fff0f0;color:#8b2525}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.item{border:1px solid #e1e8ed;border-radius:10px;padding:12px}.label{font-size:.7rem;font-weight:900;text-transform:uppercase;color:#718394;margin-bottom:4px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><script src="../js/brightace-api-config.js"></script></head><body><header class="nav"><div class="container nav-inner"><a class="brand" href="../index.html"><img src="../assets/brightace-logo.webp" alt="BrightAce Academy logo"><div class="brand-text"><div class="brand-name"><span class="bright">Bright</span><span class="ace">Ace</span></div><div class="brand-sub">ACADEMY</div></div></a></div></header><main><div class="verify-shell"><div class="verify-card"><div class="eyebrow">BRIGHTACE ACADEMY</div><h1>Statement Verification</h1><p>Use this page to verify a BrightAce transaction statement reference printed on the PDF.</p><div id="result" class="status">Checking statement reference…</div><div id="details" class="grid" hidden></div></div></div></main><script>
const API=(window.BRIGHTACE_API_URL||"https://script.google.com/macros/s/AKfycbzwomGZZZwzKCCAEVhFo9OBTkgz_aKNA6DyO7cIYh_cN8g90e-8dCPl18Bs5XxaH13u/exec");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
(async()=>{const ref=new URLSearchParams(location.search).get("ref")||"",box=document.getElementById("result"),details=document.getElementById("details");if(!ref){box.className="status bad";box.textContent="No statement reference was supplied.";return}try{const r=await fetch(API+"?action=verifyStatement&reference="+encodeURIComponent(ref),{cache:"no-store"}),d=await r.json();if(!d.ok||!d.statement){box.className="status bad";box.textContent=d.error||"Statement reference could not be verified.";return}const x=d.statement;box.className="status ok";box.innerHTML="✓ <strong>Authentic BrightAce statement reference found.</strong><br>Reference: "+esc(x.reference);details.hidden=false;details.innerHTML=[['Statement type',x.type],['Statement for',x.name],['Email',x.email||'Not recorded'],['Phone',x.phone||'Not recorded'],['Period',(x.fromDate||x.toDate)?((x.fromDate||'Beginning')+' to '+(x.toDate||'Present')):'All recorded transactions'],['Generated',x.generatedAt?new Date(x.generatedAt).toLocaleString():''],['Transactions',String(x.transactionCount)],['Integrity code',x.integrityHash||'']].map(a=>'<div class="item"><div class="label">'+esc(a[0])+'</div><div>'+esc(a[1])+'</div></div>').join('')}catch(e){box.className="status bad";box.textContent="The verification service could not be reached. Keep the statement reference and try again later."}})();
</script></body></html>
