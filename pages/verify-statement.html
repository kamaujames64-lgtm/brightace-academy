<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Verify BrightAce Statement</title><link rel="stylesheet" href="../css/style.css"><style>*{box-sizing:border-box}.verify-shell{width:min(760px,calc(100% - 30px));margin:clamp(18px,5vw,50px) auto;min-width:0}.verify-card{width:100%;min-width:0;background:#fff;border:1px solid #dce5ec;border-radius:18px;padding:clamp(16px,3.5vw,28px);box-shadow:0 12px 35px rgba(16,38,63,.08);overflow:hidden}.verify-card h1,.verify-card p{overflow-wrap:anywhere}.status{max-width:100%;min-width:0;padding:14px;border:1px solid #dce5ec;border-radius:12px;margin:16px 0;overflow-wrap:anywhere;word-break:break-word;line-height:1.55}.ok{background:#e7f7ee;color:#17653d;border-color:#b9e4ca}.bad{background:#fff0f0;color:#8b2525;border-color:#f0caca}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;min-width:0}.item{min-width:0;max-width:100%;border:1px solid #e1e8ed;border-radius:10px;padding:12px;overflow:hidden;background:#fff}.item>div:last-child{min-width:0;max-width:100%;overflow-wrap:anywhere;word-break:break-word;white-space:normal;line-height:1.5}.label{font-size:.7rem;font-weight:900;text-transform:uppercase;color:#718394;margin-bottom:4px;letter-spacing:.04em}.nav-inner,.container{min-width:0;max-width:100%} @media(max-width:650px){.verify-shell{width:calc(100% - 20px);margin:18px auto}.verify-card{border-radius:14px}.grid{grid-template-columns:minmax(0,1fr);gap:9px}.item{padding:11px}}</style><script src="../js/brightace-api-config.js"></script><script src="../js/brightace-phone.js?v=20261003b" defer></script></head><body><header class="nav"><div class="container nav-inner"><a class="brand" href="../index.html"><img src="../assets/brightace-logo.webp" alt="BrightAce Academy logo"><div class="brand-text"><div class="brand-name"><span class="bright">Bright</span><span class="ace">Ace</span></div><div class="brand-sub">ACADEMY</div></div></a></div></header><main><div class="verify-shell"><div class="verify-card"><div class="eyebrow">BRIGHTACE ACADEMY</div><h1>Statement Verification</h1><p>Use this page to verify a BrightAce transaction statement reference printed on the PDF.</p><div id="result" class="status">Checking statement reference…</div><div id="details" class="grid" hidden></div></div></div></main><script>
const API=(window.BRIGHTACE_API_URL||"https://script.google.com/macros/s/AKfycbzs69au8SaV3o8wu2DHzD4VTY96oHVe0c_RUzEzzaMhD7yBkYnXujm_aJE7ZouY-JsK/exec");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
(async()=>{const ref=new URLSearchParams(location.search).get("ref")||"",box=document.getElementById("result"),details=document.getElementById("details");if(!ref){box.className="status bad";box.textContent="No statement reference was supplied.";return}try{const r=await fetch(API+"?action=verifyStatement&reference="+encodeURIComponent(ref),{cache:"no-store"}),d=await r.json();if(!d.ok||!d.statement||d.verified!==true){box.className="status bad";box.textContent=d.error||"This statement reference could not be confirmed as valid. Do not rely on this statement until BrightAce verifies it.";return}const x=d.statement;box.className="status ok";box.innerHTML="✓ <strong>Statement verified by BrightAce Academy.</strong><br>Reference: <span>"+esc(x.reference)+"</span>";details.hidden=false;details.innerHTML=[['Statement type',x.type],['Statement for',x.name],['Email',x.email||'Not recorded'],['Phone',x.phone||'Not recorded'],['Period',(x.fromDate||x.toDate)?((x.fromDate||'Beginning')+' to '+(x.toDate||'Present')):'All recorded transactions'],['Generated',x.generatedAt?new Date(x.generatedAt).toLocaleString():''],['Transactions',String(x.transactionCount)],['Integrity code',x.integrityHash||'']].map(a=>'<div class="item"><div class="label">'+esc(a[0])+'</div><div>'+esc(a[1])+'</div></div>').join('')}catch(e){box.className="status bad";box.textContent="The verification service could not be reached. Keep the statement reference and try again later."}})();
</script><script src="../js/brightace-composer.js?v=20261021c" defer></script></body></html>
