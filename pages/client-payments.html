<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Client Payments | BrightAce Academy</title><link rel="stylesheet" href="../css/style.css"><style>body{background:#f3f6f9}.shell{width:min(1200px,calc(100% - 28px));margin:24px auto}.card{background:#fff;border:1px solid #dce5ec;border-radius:16px;padding:18px;margin-bottom:14px}.row{display:flex;justify-content:space-between;gap:15px;align-items:center;border:1px solid #e2eaf0;border-radius:12px;padding:13px;margin:8px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.scroll{max-height:560px;overflow:auto}@media(max-width:650px){.row{flex-direction:column;align-items:flex-start}}</style><script src="../js/brightace-api-config.js"></script></head><body><header class="nav"><div class="container nav-inner"><a class="brand" href="../index.html"><img src="../assets/brightace-logo.webp" alt="BrightAce Academy"></a><span class="admin-top-label">CLIENT PAYMENTS</span></div></header><main><section class="page-hero"><div class="container"><div class="eyebrow">VERIFIED CLIENT AREA</div><h1>Payments & Transactions</h1><p>Review every BrightAce payment request and download your transaction statement.</p></div></section><section class="section"><div class="shell"><div id="notice" class="chat-notice" hidden></div><div class="actions" style="margin-bottom:14px"><a class="btn btn-outline" href="client-dashboard.html">← CLIENT DASHBOARD</a><a class="btn btn-outline" href="client-tutoring.html">📅 TUTORING SESSIONS</a><a class="btn btn-outline" href="chat.html">💬 LIVE CHAT</a><label>From <input id="from" type="date"></label><label>To <input id="to" type="date"></label><button id="statement" class="btn btn-primary">⬇ DOWNLOAD STATEMENT</button></div><div class="card"><h2>All payments</h2><div id="list" class="scroll">Loading…</div></div></div></section></main><script src="../js/app.js"></script><script src="../js/statement-pdf.js"></script><script>
(function(){
 const KEY="brightace_chat_session_v5";let s=null,timer=null,lastTouch=0;
 try{s=JSON.parse(localStorage.getItem(KEY)||sessionStorage.getItem(KEY)||"null")}catch(e){}
 function save(){if(s){localStorage.setItem(KEY,JSON.stringify(s));sessionStorage.setItem(KEY,JSON.stringify(s))}}
 function expireClientSession(){if(timer)clearTimeout(timer);localStorage.removeItem(KEY);sessionStorage.removeItem(KEY);location.replace("chat.html?session=expired")}
 function scheduleExpiry(){if(!s?.verified)return;const last=Number(s.lastActivityAt||0),remaining=30*60*1000-(Date.now()-last);if(!last||remaining<=0){expireClientSession();return}clearTimeout(timer);timer=setTimeout(expireClientSession,remaining)}
 async function touch(){if(!s?.verified||!s.clientSessionToken)return;const now=Date.now();if(s.lastActivityAt&&now-Number(s.lastActivityAt)>30*60*1000){expireClientSession();return}clearTimeout(timer);s.lastActivityAt=now;save();scheduleExpiry();
   if(Date.now()-lastTouch>5*60*1000){lastTouch=Date.now();try{const b=new URLSearchParams();b.set("payload",JSON.stringify({action:"clientTouchSession",clientSessionToken:s.clientSessionToken,phone:s.phone}));const r=await fetch((window.BRIGHTACE_API_URL||"https://script.google.com/macros/s/AKfycbzwomGZZZwzKCCAEVhFo9OBTkgz_aKNA6DyO7cIYh_cN8g90e-8dCPl18Bs5XxaH13u/exec"),{method:"POST",body:b,cache:"no-store"});const raw=await r.text();let d;try{d=JSON.parse(raw)}catch(e){throw Error("BrightAce Apps Script returned HTML instead of JSON. Please deploy the latest Code.gs to the /exec web-app and confirm access is Anyone.")}if(!d.ok)throw Error(d.error||"Client session could not be refreshed.");s.clientSessionExpiresAt=d.expiresAt||s.clientSessionExpiresAt;save()}catch(e){if(/session|verification|verify|expired/i.test(String(e?.message||"")))expireClientSession()}}
 }
 document.addEventListener("click",touch,{passive:true});document.addEventListener("keydown",touch,{passive:true});document.addEventListener("input",touch,{passive:true});
 if(!s?.verified){location.replace("chat.html");return}
 if(!s.clientSessionToken||!s.lastActivityAt||Date.now()-Number(s.lastActivityAt)>30*60*1000){expireClientSession();return}
 window.ensureClientSession=async function(){
   if(!s?.verified||!s.clientSessionToken){expireClientSession();return false}
   if(!s.id||!s.phone){expireClientSession();return false}
   try{const b=new URLSearchParams();b.set("payload",JSON.stringify({action:"clientDashboardBootstrap",conversationId:s.id,phone:s.phone,clientSessionToken:s.clientSessionToken,clientAccessToken:s.clientAccessToken||""}));const ctrl=new AbortController(),tm=setTimeout(()=>ctrl.abort(),45000);let d;try{const r=await fetch((window.BRIGHTACE_API_URL||"https://script.google.com/macros/s/AKfycbzwomGZZZwzKCCAEVhFo9OBTkgz_aKNA6DyO7cIYh_cN8g90e-8dCPl18Bs5XxaH13u/exec"),{method:"POST",body:b,cache:"no-store",signal:ctrl.signal});const raw=await r.text();try{d=JSON.parse(raw)}catch(e){throw Error("BrightAce Apps Script returned HTML instead of JSON. Please deploy the latest Code.gs to the /exec web-app and confirm access is Anyone.") }}finally{clearTimeout(tm)}if(!d.ok)throw Error(d.error||"Your verified client session could not be restored.");s.clientAccessToken=d.clientAccessToken||s.clientAccessToken;s.clientSessionToken=d.clientSessionToken||s.clientSessionToken;s.clientSessionExpiresAt=d.clientSessionExpiresAt||s.clientSessionExpiresAt;s.lastActivityAt=Date.now();save();scheduleExpiry();return true}catch(e){const msg=String(e?.message||"");if(/session|verification|verify|expired|login is required/i.test(msg)){expireClientSession();}else{if(typeof notice==="function")notice(msg||"BrightAce could not restore the client session right now. Please try again.","warning");}return false}
 }
 window.ensureClientSession().then(ok=>{if(ok)touch()});
 window.BrightAceClientSession=s;
})();
</script><script>
const API=(window.BRIGHTACE_API_URL||"https://script.google.com/macros/s/AKfycbzwomGZZZwzKCCAEVhFo9OBTkgz_aKNA6DyO7cIYh_cN8g90e-8dCPl18Bs5XxaH13u/exec"),KEY="brightace_chat_session_v5";let s=null,d=null;try{s=JSON.parse(localStorage.getItem(KEY)||sessionStorage.getItem(KEY)||"null")}catch(e){}const $=id=>document.getElementById(id);function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}async function post(action,p={}){const b=new URLSearchParams();b.set("payload",JSON.stringify({action,...p}));const ctrl=new AbortController(),tm=setTimeout(()=>ctrl.abort(),45000);try{const r=await fetch(API,{method:"POST",body:b,cache:"no-store",signal:ctrl.signal});const x=await r.json();if(!x.ok)throw Error(x.error||"Request failed");return x}catch(e){if(e.name==="AbortError")throw Error("BrightAce is taking too long to respond. Please refresh and try again.");throw e}finally{clearTimeout(tm)}}function notice(t,type="info"){$("notice").textContent=t;$("notice").className="chat-notice "+type;$('notice').hidden=!t}async function downloadClientStatement(){
 const b=$("statement");b.disabled=true;b.textContent="PREPARING…";
 try{
  const from=$("from").value,to=$("to").value;
  const d2=await post("registerStatement",{statementType:"CLIENT",clientSessionToken:s.clientSessionToken,phone:s.phone,from,to});
  const rows=d2.transactions||[],tx=rows.map(x=>({date:x.paidAt||x.createdAt,type:"CLIENT PAYMENT",reference:x.reference||x.requestId,details:(x.service||"BrightAce service")+" - "+(x.status||""),amount:Number(x.amount||0),currency:x.currency,status:x.status}));
  const period=(from||to)?((from||"Beginning")+" to "+(to||"Present")):"All recorded transactions";
  const paid=rows.filter(x=>String(x.status||"").toUpperCase()==="PAID").reduce((a,x)=>a+Number(x.amount||0),0),total=rows.reduce((a,x)=>a+Number(x.amount||0),0);
  await BrightAceStatementPDF.download({title:"BrightAce Academy Transaction Statement",subtitle:"Client Financial Transaction Record",party:{name:d2.party?.name||s.name||"Client",email:d2.party?.email||"",phone:d2.party?.phone||s.phone||"",identifier:d2.party?.id||""},transactions:tx,statementReference:d2.statementReference,integrityHash:d2.integrityHash,verificationUrl:d2.verificationUrl,generatedAt:d2.generatedAt,periodText:period,summary:{total:total,paid:paid,currency:rows[0]?.currency||"KES",note:"Official BrightAce Academy client transaction record. Use the statement reference or QR verification to check authenticity."},filename:"BrightAce-Client-Transaction-Statement-"+(d2.statementReference||"").replace(/[^A-Za-z0-9-]/g,"")+".pdf"});
  notice("Statement downloaded successfully. Reference: "+d2.statementReference,"success");
 }catch(e){notice(e.message||"Could not prepare statement.","error")}finally{b.disabled=false;b.textContent="⬇ DOWNLOAD STATEMENT"}
}

async function load(){if(!s?.verified)return location.href="chat.html";if(!(await window.ensureClientSession()))return;try{d=await post("clientDashboard",{conversationId:s.id,clientAccessToken:s.clientAccessToken,clientSessionToken:s.clientSessionToken,phone:s.phone});$('list').innerHTML=(d.payments||[]).map(x=>`<div class="row"><div><strong>${esc(x.service||"BrightAce service")}</strong><div>${esc(x.requestId)} · ${esc(x.currency)} ${Number(x.amount||0).toFixed(2)} · ${esc(x.status)}</div><small>${x.reference?"Reference: "+esc(x.reference):""}</small></div><div class="actions"><a class="btn btn-outline" href="receipt.html?request=${encodeURIComponent(x.requestId)}" target="_blank" rel="noopener">RECEIPT</a>${String(x.status).toUpperCase()!=="PAID"?`<a class="btn btn-primary" href="payment.html?request=${encodeURIComponent(x.requestId)}">PAY NOW</a>`:""}</div></div>`).join("")||'<p>No transactions found.</p>';notice("Payments loaded.","success")}catch(e){notice(e.message,"error")}}$('statement').onclick=downloadClientStatement;load();
</script></body></html>
