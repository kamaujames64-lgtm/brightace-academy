<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Client Statement | BrightAce Academy</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/client-portal.css"><script src="../js/brightace-api-config.js"></script><style>
body{background:#f3f6f9}.statement{width:min(980px,94%);margin:30px auto;background:#fff;border:1px solid #dce6f1;border-radius:18px;padding:28px;box-shadow:0 12px 40px rgba(3,21,47,.08)}.statement-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;border-bottom:2px solid #edf2f6;padding-bottom:18px}.statement-brand{display:flex;align-items:center;gap:10px}.statement-brand img{width:54px;height:54px;object-fit:contain}.statement-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.statement-box{background:#f8fafc;border:1px solid #e3ebf2;border-radius:10px;padding:12px}.statement-label{font-size:10px;text-transform:uppercase;font-weight:900;color:#718394}.statement-value{font-weight:800;color:#10263f;margin-top:4px}.statement-table{width:100%;border-collapse:collapse}.statement-table th,.statement-table td{padding:10px 8px;border-bottom:1px solid #e8eef3;text-align:left;font-size:12px}.statement-table th{font-size:10px;text-transform:uppercase;color:#687b8e;background:#f8fafc}.statement-summary{display:flex;justify-content:flex-end;gap:20px;margin-top:18px;flex-wrap:wrap}.statement-summary strong{font-size:18px;color:#10263f}.notice{margin:14px 0;padding:10px 12px;background:#f5f9fc;border-radius:9px;color:#607487;font-size:12px}@media(max-width:650px){.statement-head,.statement-meta{grid-template-columns:1fr;display:grid}.statement-table{min-width:760px}.table-scroll{overflow:auto}}@media print{body{background:#fff}.statement{box-shadow:none;border:0;margin:0;width:auto;padding:0}.no-print{display:none!important}}
</style><script src="../js/brightace-phone.js?v=20261003b" defer></script></head><body class="client-portal-page"><nav aria-label="Client portal navigation" class="client-portal-nav no-print"><a href="client-dashboard.html">⌂ Dashboard</a><a href="client-new-request.html">＋ New Request</a><a href="client-requests.html">▤ Requests</a><a href="client-tutoring.html">▣ Sessions</a><a href="client-messages.html">✉ Messages</a><a href="client-work.html">▤ Work</a><a href="client-progress.html">◒ Progress</a><a class="active" href="client-payments.html">▰ Payments</a><a href="client-profile.html">⚙ Profile</a></nav>
<main class="statement"><div class="statement-head"><div><div class="statement-brand"><img src="../assets/brightace-logo.webp" alt="BrightAce Academy"><div><strong>BrightAce Academy</strong><small style="display:block;color:#718394">OFFICIAL CLIENT STATEMENT</small></div></div><h1 id="title" style="margin-top:18px">Client Statement</h1></div><div class="no-print" style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn btn-outline" href="client-payments.html">← BACK TO PAYMENTS</a><button class="btn btn-primary" id="downloadOfficialStatement">DOWNLOAD OFFICIAL PDF</button><button class="btn btn-outline" onclick="window.print()">PRINT / SAVE PDF</button></div></div><div id="body">Loading statement…</div></main><script>
const API=window.BRIGHTACE_API_URL;if(!API)throw Error("BrightAce API configuration is missing.");const KEY='brightace_chat_session_v5';let s=null;try{s=JSON.parse(localStorage.getItem(KEY)||sessionStorage.getItem(KEY)||'null')}catch(e){};const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const dt=v=>{if(!v)return '—';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'})};const money=(n,c)=>{try{return new Intl.NumberFormat(undefined,{style:'currency',currency:c||'KES'}).format(Number(n||0))}catch(e){return (c||'KES')+' '+Number(n||0).toFixed(2)}};
async function load(){if(!s?.clientSessionToken||!s?.phone){document.getElementById('body').innerHTML='<div class="notice">Your verified client session is required. <a href="client-messages.html">OPEN MESSAGES</a></div>';return}try{const selectedCurrency='USD';const q=new URLSearchParams({action:'clientStatement',clientSessionToken:s.clientSessionToken,phone:s.phone,displayCurrency:selectedCurrency});const r=await fetch(API+'?'+q.toString(),{cache:'no-store'});const d=await r.json();if(!d.ok)throw Error(d.error||'Statement could not be loaded.');const ref=new URLSearchParams(location.search).get('reference')||'Not registered';const tx=Array.isArray(d.transactions)?d.transactions:[];let paid=0,refund=0,pending=0;tx.forEach(x=>{x.displayCurrency=x.currency||d.displayCurrency||selectedCurrency;});tx.forEach(x=>{if(String(x.type).toUpperCase()==='PAYMENT'&&String(x.status).toUpperCase()==='PAID')paid+=Number(x.amount||0);if(String(x.type).toUpperCase()==='REFUND'&&String(x.status).toUpperCase()==='APPROVED')refund+=Number(x.amount||0);if(String(x.status).toUpperCase()==='PENDING')pending+=Number(x.amount||0)});document.getElementById('body').innerHTML=`<div class="statement-meta"><div class="statement-box"><div class="statement-label">Client</div><div class="statement-value">${esc(d.client?.name||'Client')}</div></div><div class="statement-box"><div class="statement-label">Phone</div><div class="statement-value">${esc(d.client?.phone||'—')}</div></div><div class="statement-box"><div class="statement-label">Statement Reference</div><div class="statement-value">${esc(ref)}</div></div><div class="statement-box"><div class="statement-label">Generated</div><div class="statement-value">${esc(new Date().toLocaleString())}</div></div></div><div class="notice">This statement includes recorded paid transactions and refund activity linked to your verified BrightAce client profile. Keep the statement reference for verification.</div><div class="table-scroll"><table class="statement-table"><thead><tr><th>Date</th><th>Type</th><th>Request / Refund ID</th><th>Details</th><th>Amount</th><th>Status</th></tr></thead><tbody>${tx.map(x=>`<tr><td>${esc(dt(x.date||x.paidAt||x.createdAt))}</td><td>${esc(x.type||'TRANSACTION')}</td><td>${esc(x.refundId||x.requestId||'—')}</td><td>${esc(x.details||x.service||'BrightAce service')}</td><td><strong>${esc(money(x.amount,x.currency))}</strong>${x.originalCurrency&&x.originalCurrency!==x.currency?`<small style=\"display:block;color:#718394;margin-top:3px\">Original: ${esc(money(x.originalAmount,x.originalCurrency))}</small>`:''}</td><td>${esc(x.status||'—')}</td></tr>`).join('')||'<tr><td colspan="6">No financial transactions recorded.</td></tr>'}</tbody></table></div><div class="statement-summary"><span>Paid: <strong>${money(paid,d.displayCurrency||selectedCurrency)}</strong></span><span>Refunded: <strong>${money(refund,d.displayCurrency||selectedCurrency)}</strong></span><span>Pending: <strong>${money(pending,d.displayCurrency||selectedCurrency)}</strong></span></div>`}catch(e){document.getElementById('body').innerHTML='<div class="notice">'+esc(e.message||'Statement could not be loaded.')+'</div>'}}load();
</script><script>
async function downloadOfficialStatement(){const b=document.getElementById("downloadOfficialStatement");try{b.disabled=true;b.textContent="PREPARING PDF…";const ss=JSON.parse(localStorage.getItem("brightace_chat_session_v5")||sessionStorage.getItem("brightace_chat_session_v5")||"null");if(!ss?.clientSessionToken||!ss?.phone)throw Error("Your verified client session is required.");const u=window.BRIGHTACE_API_URL;if(!u)throw Error("BrightAce API configuration is missing.");const payload={action:"registerStatement",statementType:"CLIENT",clientSessionToken:ss.clientSessionToken,clientAccessToken:ss.clientAccessToken||"",phone:ss.phone,displayCurrency:"USD"};const r=await fetch(u,{method:"POST",body:new URLSearchParams({payload:JSON.stringify(payload)}),cache:"no-store"});const d=await r.json();if(!d.ok)throw Error(d.error||"Statement could not be prepared.");if(!window.BrightAceStatementPDF){await new Promise((resolve,reject)=>{const el=document.createElement("script");el.src="../js/statement-pdf.js";el.onload=resolve;el.onerror=()=>reject(Error("The official statement PDF component could not be loaded."));document.head.appendChild(el)})}const tx=d.transactions||[],incoming=tx.filter(x=>String(x.type).toUpperCase()==="PAYMENT"&&String(x.status).toUpperCase()==="PAID").reduce((n,x)=>n+Number(x.amount||0),0),outgoing=tx.filter(x=>String(x.type).toUpperCase()==="REFUND"&&String(x.status).toUpperCase()==="APPROVED").reduce((n,x)=>n+Number(x.amount||0),0),currency=String(d.displayCurrency||tx.find(x=>x.currency)?.currency||"USD").toUpperCase();await window.BrightAceStatementPDF.download({title:"Official Client Financial Statement",subtitle:"BrightAce Academy • Paid Transactions & Refund Activity",statementReference:d.statementReference,integrityHash:d.integrityHash,verificationUrl:d.verificationUrl,generatedAt:d.generatedAt,party:d.party,transactions:tx,periodText:(d.range?.from||d.range?.to)?`${d.range?.from||"Start"} to ${d.range?.to||"Present"}`:"All recorded financial activity",summary:{currency,incoming,outgoing,net:incoming-outgoing,note:"Official BrightAce Academy record of paid transactions and refund activity."},filename:`BrightAce-Client-Statement-${d.statementReference}.pdf`})}catch(e){alert(e.message||"Statement download failed.")}finally{b.disabled=false;b.textContent="DOWNLOAD OFFICIAL PDF"}}
document.getElementById("downloadOfficialStatement")?.addEventListener("click",downloadOfficialStatement);
</script><nav aria-label="Mobile client navigation" class="client-mobile-nav-shared no-print"><a href="client-dashboard.html"><span>⌂</span>Home</a><a href="client-new-request.html"><span>＋</span>New Request</a><a href="client-tutoring.html"><span>▣</span>Sessions</a><a href="client-messages.html"><span>✉</span>Messages</a><a href="client-resources.html"><span>▤</span>Resources</a><a class="active" href="client-payments.html"><span>▰</span>Pay</a></nav><script src="../js/brightace-composer.js?v=20261002b" defer></script></body></html>
