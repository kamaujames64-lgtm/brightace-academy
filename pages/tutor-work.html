<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Tutor Work | BrightAce Academy</title><link rel="stylesheet" href="../css/style.css"><style>body{background:#f3f6f9}.shell{width:min(1300px,calc(100% - 28px));margin:24px auto}.navx,.actions{display:flex;gap:8px;flex-wrap:wrap}.navx{background:#fff;padding:8px;border:1px solid #dce5ec;border-radius:14px;margin-bottom:14px}.navx a{padding:10px 12px;text-decoration:none;font-weight:850;color:#10263f}.navx a.active,.navx a:hover{background:#10263f;color:#fff;border-radius:9px}.grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:14px}.card,.work{background:#fff;border:1px solid #dce5ec;border-radius:15px;padding:16px}.work{margin:8px 0;cursor:pointer}.work.active{outline:2px solid #0f7f8c}.scroll{max-height:420px;overflow:auto}.meta{color:#718394;font-size:.82rem}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style><script src="../js/brightace-api-config.js"></script></head><body><header class="nav"><div class="container nav-inner"><a class="brand" href="../index.html"><img src="../assets/brightace-logo.webp" alt="BrightAce Academy"></a><span class="admin-top-label">TUTOR WORK</span></div></header><main><section class="page-hero"><div class="container"><div class="eyebrow">VERIFIED TUTOR AREA</div><h1>Assigned Work</h1><p>Open requests, accept or decline assignments, submit work, and communicate with the client inside BrightAce.</p></div></section><section class="section"><div class="shell"><nav class="navx"><a href="tutor.html">Overview</a><a class="active" href="tutor-work.html">Assigned Work</a><a href="tutor-profile.html">Profile</a><a href="tutor-wallet.html">Payment Wallet</a><a href="tutor-messages.html">Admin WhatsApp</a></nav><div id="notice" class="chat-notice" hidden></div><div class="grid"><section class="card"><h2>Requests</h2><div id="works" class="scroll">Loading…</div></section><section class="card"><div id="detail">Select a request.</div></section></div></div></section></main><script src="../js/app.js"></script><script>
const API=(window.BRIGHTACE_API_URL||"https://script.google.com/macros/s/AKfycbzwomGZZZwzKCCAEVhFo9OBTkgz_aKNA6DyO7cIYh_cN8g90e-8dCPl18Bs5XxaH13u/exec"),KEY="brightace_tutor_token_v1";const token=window.BrightAceTutorSession?.get?.()||sessionStorage.getItem(KEY)||localStorage.getItem(KEY)||"";let data=null,selected=null;const $=id=>document.getElementById(id);function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}async function api(action,p={}){const b=new URLSearchParams();b.set("payload",JSON.stringify({action,tutorToken:token,...p}));const r=await fetch(API,{method:"POST",body:b,cache:"no-store"}),x=await r.json();if(!x.ok)throw Error(x.error||"Request failed");return x}function notice(t,type="info"){$("notice").textContent=t;$('notice').className="chat-notice "+type;$('notice').hidden=!t}function att(a){if(!a)return"";if(Array.isArray(a))return a.map(att).join("");const u=esc(a.downloadUrl||a.viewUrl||"#");return `<div>📎 ${esc(a.name||"Attachment")} <a href="${u}" target="_blank" rel="noopener" download>DOWNLOAD</a></div>`}function render(){const w=data?.works||[];$('works').innerHTML=w.map((x,i)=>`<article class="work ${selected?.conversationId===x.conversationId?'active':''}" data-i="${i}"><strong>${esc(x.studentName)}</strong><div class="meta">${esc(x.conversationId)} · ${esc(x.assignmentStatus||'NEW_REQUEST')} · ${esc(x.tutorWorkStatus||'RECEIVED')}</div><div class="meta">Payment: ${esc(x.paymentStatus||'NOT_PAID')} · Payout: ${x.tutorPayout==null?'Pending':esc(x.currency)+' '+Number(x.tutorPayout).toFixed(2)}</div></article>`).join("")||'<p class="meta">No assigned requests.</p>';document.querySelectorAll('.work').forEach(b=>b.onclick=()=>{selected=w[+b.dataset.i];render();renderDetail()})}function renderDetail(){const x=selected;if(!x)return;$('detail').innerHTML=`<h2>${esc(x.studentName)} — ${esc(x.conversationId)}</h2><div class="meta">${esc(x.assignmentStatus)} · ${esc(x.tutorWorkStatus||'RECEIVED')} · Deadline: ${esc(x.deadline||'As agreed')}</div><p>${esc(x.workDescription||'')}</p><div class="actions"><button id="accept" class="btn btn-primary"${["ACCEPTED","IN_PROGRESS","READY_FOR_QA","REVISION_REQUESTED"].includes(String(x.tutorWorkStatus||"").toUpperCase())?" disabled":""}>${["ACCEPTED","IN_PROGRESS","READY_FOR_QA","REVISION_REQUESTED"].includes(String(x.tutorWorkStatus||"").toUpperCase())?"✓ JOB ACCEPTED":"ACCEPT WORK"}</button><button id="decline" class="btn btn-outline"${["ACCEPTED","IN_PROGRESS","READY_FOR_QA","REVISION_REQUESTED"].includes(String(x.tutorWorkStatus||"").toUpperCase())?" disabled":""}>${["ACCEPTED","IN_PROGRESS","READY_FOR_QA","REVISION_REQUESTED"].includes(String(x.tutorWorkStatus||"").toUpperCase())?"JOB ACCEPTED":"DECLINE WORK"}</button></div><h3>Client/Admin documents</h3><div class="scroll">${(x.documents||[]).map(att).join('')||'<p class="meta">No documents.</p>'}</div><h3>Client/Tutor activity</h3><div class="scroll">${(x.clientTutorMessages||[]).map(m=>`<div class="work"><strong>${esc(m.senderName||m.sender)}</strong><div>${esc(m.text||'')}</div>${att(m.attachment)}<small>${m.timestamp?new Date(m.timestamp).toLocaleString():''}</small></div>`).join('')||'<p class="meta">No messages yet.</p>'}</div><form id="comment" class="form"><textarea id="ct" rows="3" placeholder="Comment to the client and Admin…"></textarea><div id="tutorWorkEmoji" style="display:none;gap:4px;flex-wrap:wrap;padding:8px;border:1px solid #dce5ec;border-radius:10px;background:#fff"></div><input id="cf" type="file" multiple><button id="tutorEmojiBtn" type="button" class="btn btn-outline">😊 EMOJI</button><button class="btn btn-outline">SEND COMMENT</button></form>`;$('accept').onclick=async()=>{try{await api('tutorAcceptWork',{conversationId:x.conversationId});notice('Work accepted successfully.','success');await load()}catch(e){notice(e.message,'error')}};$('decline').onclick=async()=>{const r=prompt('Reason for declining this work:');if(!r)return;try{await api('tutorDeclineWork',{conversationId:x.conversationId,reason:r});selected=null;notice('Work declined and returned to Admin.','success');await load()}catch(e){notice(e.message,'error')}};$('comment').onsubmit=async e=>{e.preventDefault();const text=$('ct').value.trim(),files=[...$('cf').files],at=[];for(const f of files){const r=new FileReader();at.push(await new Promise((res,rej)=>{r.onload=()=>res({name:f.name,mimeType:f.type||'application/octet-stream',size:f.size,dataUrl:r.result});r.onerror=()=>rej(Error('Could not read file'));r.readAsDataURL(f)}))}try{await api('tutorAddWorkComment',{conversationId:x.conversationId,text,attachments:at});notice('Comment sent to the client and Admin.','success');await load()}catch(e){notice(e.message,'error')}}}
function setupTutorEmoji(){
 const box=$('tutorWorkEmoji'),input=$('ct'),btn=$('tutorEmojiBtn');if(!box||!input||!btn)return;
 if(!box.dataset.ready){["😀","😂","😊","😍","👍","🙏","👏","💪","❤️","🔥","✨","🎉","🎓","📚","💡","✅","❌","⭐"].forEach(e=>{const b=document.createElement('button');b.type='button';b.textContent=e;b.style.cssText='border:0;background:#f4f7f9;border-radius:7px;padding:5px;cursor:pointer';b.onclick=()=>{input.value+=(input.value?' ':'')+e;input.focus()};box.appendChild(b)});box.dataset.ready='1';}
 btn.onclick=()=>box.style.display=box.style.display==='flex'?'none':'flex';
}
async function load(silent=false){
 if(!token)return location.href='tutor.html';
 try{data=await api('tutorDashboard');
const works=data.works||[];
const sig=works.map(x=>`${x.conversationId||x.requestId||''}:${x.assignmentStatus||''}:${x.tutorWorkStatus||''}:${x.paymentStatus||''}:${x.payoutAmount||''}`).join('|');
if(window.__baTutorWorkSig!==undefined&&sig!==window.__baTutorWorkSig)window.BrightAceSound?.notify('tutor-work-update',sig);
window.__baTutorWorkSig=sig;
const due=window.BrightAceSound?.checkDeadlines(works,{windowHours:24,keyPrefix:'tutor-work'});
if(due?.length)notice(`Deadline reminder: ${due.length} assigned job${due.length===1?' is':'s are'} approaching the deadline.`,'warning');
if(selected)selected=works.find(x=>x.conversationId===selected.conversationId)||null;render();renderDetail();setupTutorEmoji();if(!silent)notice('Tutor work loaded.','success')}
 catch(e){if(!silent)notice(e.message,'error')}
}
load();window.BrightAceScheduler.start("tutor-work",()=>{if(!document.querySelector('textarea:focus,input:focus,select:focus'))return load(true)},20000);

</script></body></html>
