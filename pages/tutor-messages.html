<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Tutor Admin Messages | BrightAce Academy</title><link rel="stylesheet" href="../css/style.css"><style>body{background:#f3f6f9}.shell{width:min(1000px,calc(100% - 28px));margin:24px auto}.navx,.actions{display:flex;gap:8px;flex-wrap:wrap}.navx{background:#fff;padding:8px;border:1px solid #dce5ec;border-radius:14px;margin-bottom:14px}.navx a{padding:10px 12px;text-decoration:none;font-weight:850;color:#10263f}.navx a.active,.navx a:hover{background:#10263f;color:#fff;border-radius:9px}.card{background:#fff;border:1px solid #dce5ec;border-radius:15px;padding:18px}.messages{height:520px;overflow:auto}.m{padding:10px;border:1px solid #e1e8ed;border-radius:10px;margin:8px 0}.m.admin{border-left:4px solid #0f7f8c}.m.tutor{border-left:4px solid #f2b632}</style><script src="../js/brightace-api-config.js"></script></head><body><header class="nav"><div class="container nav-inner"><a class="brand" href="../index.html"><img src="../assets/brightace-logo.webp" alt="BrightAce Academy"></a><span class="admin-top-label">TUTOR ADMIN WHATSAPP</span></div></header><main><section class="page-hero"><div class="container"><div class="eyebrow">PRIVATE TUTOR ↔ ADMIN CHANNEL</div><h1>Admin Messages</h1><p>This channel is only for tutor ↔ BrightAce Admin communication. Client conversations remain inside each assigned work record.</p></div></section><section class="section"><div class="shell"><nav class="navx"><a href="tutor.html">Overview</a><a href="tutor-work.html">Assigned Work</a><a href="tutor-profile.html">Profile</a><a href="tutor-wallet.html">Payment Wallet</a><a class="active" href="tutor-messages.html">Admin WhatsApp</a></nav><div id="notice" class="chat-notice" hidden></div><section class="card"><div id="messages" class="messages">Loading…</div><form id="form" class="actions" style="margin-top:10px"><textarea id="text" rows="3" style="flex:1;min-width:240px" placeholder="Message BrightAce Admin…"></textarea><button class="btn btn-primary">SEND TO ADMIN WHATSAPP</button></form></section></div></section></main><script src="../js/app.js"></script><script>const API=(window.BRIGHTACE_API_URL||"https://script.google.com/macros/s/AKfycbzwomGZZZwzKCCAEVhFo9OBTkgz_aKNA6DyO7cIYh_cN8g90e-8dCPl18Bs5XxaH13u/exec"),KEY="brightace_tutor_token_v1",token=window.BrightAceTutorSession?.get?.()||sessionStorage.getItem(KEY)||localStorage.getItem(KEY)||"",$=id=>document.getElementById(id);function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}async function api(action,p={}){const b=new URLSearchParams();b.set('payload',JSON.stringify({action,tutorToken:token,...p}));const r=await fetch(API,{method:'POST',body:b}),x=await r.json();if(!x.ok)throw Error(x.error||'Request failed');return x}function notice(t,type='info'){$('notice').textContent=t;$('notice').className='chat-notice '+type;$('notice').hidden=!t}let lastMessageSignature='';
function renderMessages(messages,keepScroll=true){
 const box=$('messages'),wasNearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<80;
 const html=(messages||[]).map(m=>`<div class="m ${m.sender==='admin'?'admin':'tutor'}"><strong>${esc(m.senderName||m.sender)}</strong><div>${esc(m.text||'')}</div><small>${m.timestamp?new Date(m.timestamp).toLocaleString():''}</small></div>`).join('')||'<p>No Admin messages yet.</p>';
 const sig=(messages||[]).map(m=>String(m.id||'')+'|'+String(m.timestamp||'')+'|'+String(m.text||'')).join('||');
 if(sig!==lastMessageSignature){box.innerHTML=html;lastMessageSignature=sig;if(wasNearBottom||!keepScroll)box.scrollTop=box.scrollHeight;}
}
let firstTutorMessagesLoad=true,lastTutorMessageSignature="";
async function load(silent=false){if(!token)return location.href='tutor.html';try{const d=await api('tutorGetAdminMessages');const msgs=d.messages||[];const sig=msgs.map(m=>`${m.id||''}:${m.status||''}:${m.timestamp||''}:${m.text||''}`).join('|');if(!firstTutorMessagesLoad&&sig!==lastTutorMessageSignature)window.BrightAceSound?.notify('tutor-message',sig);lastTutorMessageSignature=sig;firstTutorMessagesLoad=false;renderMessages(msgs);if(!silent)notice('Admin messages loaded.','success')}catch(e){if(!silent)notice(e.message,'error')}}
$('form').onsubmit=async e=>{
 e.preventDefault();const text=$('text').value.trim();if(!text)return;
 const btn=e.submitter||$('form button');if(btn)btn.disabled=true;
 const temp={id:'pending-'+Date.now(),sender:'tutor',senderName:'You',text,timestamp:new Date().toISOString()};
 const box=$('messages');const nearBottom=box.scrollHeight-box.scrollTop-box.clientHeight<120;
 box.insertAdjacentHTML('beforeend',`<div class="m tutor" data-pending="1"><strong>You</strong><div>${esc(text)}</div><small>Sending…</small></div>`);if(nearBottom)box.scrollTop=box.scrollHeight;$('text').value='';
 try{await api('tutorSendAdminMessage',{text});notice('Message sent successfully to BrightAce Admin.','success');await load(true)}
 catch(e){box.querySelector('[data-pending="1"]')?.remove();$('text').value=text;notice(e.message,'error')}
 finally{if(btn)btn.disabled=false}
};
load();window.BrightAceScheduler.start("tutor-messages",()=>{if(!document.querySelector('textarea:focus,input:focus'))return load(true)},20000);
