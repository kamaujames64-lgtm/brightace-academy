<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>BrightAce Academy | Resource Viewer</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#07111f;color:#f8fafc}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:flex;flex-direction:column;background:#07111f}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 18px;background:#101d30;border-bottom:1px solid #26364d}
h1{font-size:clamp(1rem,2.5vw,1.4rem);margin:0;overflow-wrap:anywhere}.brand{font-weight:800;color:#dbeafe;white-space:nowrap}
a.back{color:#fff;text-decoration:none;border:1px solid #52647d;border-radius:9px;padding:9px 12px;white-space:nowrap}
main{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:18px}
#media{width:100%;height:100%;min-height:60dvh;display:flex;align-items:center;justify-content:center}
#media img{display:block;max-width:100%;max-height:calc(100dvh - 120px);width:auto;height:auto;object-fit:contain}
#media video,#media iframe{display:block;width:min(1200px,100%);height:min(78dvh,800px);border:0;background:#000;object-fit:contain;border-radius:10px}
#status{color:#cbd5e1;text-align:center;padding:20px}
@media(max-width:600px){header{padding:12px;align-items:flex-start}a.back{padding:8px;font-size:.9rem}main{padding:8px}#media video,#media iframe{height:72dvh;border-radius:0}}
</style>
</head>
<body>
<header><div class="brand">BrightAce Academy</div><h1 id="title">Resource viewer</h1><a class="back" href="resources.html">← Resources</a></header>
<main><div id="media"><p id="status">Opening resource…</p></div></main>
<script>
(function(){
 const q=new URLSearchParams(location.search),type=String(q.get('type')||'').toUpperCase(),raw=q.get('url')||'',title=q.get('title')||'BrightAce resource',host=document.getElementById('media');
 document.getElementById('title').textContent=title;document.title=title+' | BrightAce Academy';
 let url='';try{const u=new URL(raw);if(u.protocol==='https:')url=u.href}catch(e){}
 if(!url){document.getElementById('status').textContent='This resource link is invalid or unavailable.';return}
 function driveId(s){const m=String(s).match(/drive\.google\.com\/(?:file\/d\/|uc\?[^#]*?id=|thumbnail\?id=)([A-Za-z0-9_-]{10,})/i);return m?m[1]:''}
 function youtubeId(s){try{const u=new URL(s);if(u.hostname==='youtu.be')return u.pathname.split('/').filter(Boolean)[0]||'';if(/(^|\.)youtube\.com$/i.test(u.hostname)||/(^|\.)youtube-nocookie\.com$/i.test(u.hostname)){if(u.pathname==='/watch')return u.searchParams.get('v')||'';const m=u.pathname.match(/^\/(?:embed|shorts|live)\/([^/?]+)/);return m?m[1]:''}}catch(e){}return ''}
 function vimeoId(s){try{const u=new URL(s);if(/(^|\.)vimeo\.com$/i.test(u.hostname)){const m=u.pathname.match(/\/(\d+)/);return m?m[1]:''}}catch(e){}return ''}
 let el;
 if(type==='IMAGE'){el=document.createElement('img');el.alt=title;el.src=url;el.addEventListener('error',()=>{host.innerHTML='<p id="status">The image could not be loaded. Check that the media is publicly viewable.</p>'},{once:true})}
 else if(type==='VIDEO'){
   const yt=youtubeId(url),vm=vimeoId(url),id=driveId(url);
   if(yt||vm||id){el=document.createElement('iframe');el.title=title;el.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';el.allowFullscreen=true;el.referrerPolicy='strict-origin-when-cross-origin';el.src=yt?'https://www.youtube-nocookie.com/embed/'+encodeURIComponent(yt)+'?autoplay=1&rel=0':vm?'https://player.vimeo.com/video/'+encodeURIComponent(vm)+'?autoplay=1':'https://drive.google.com/file/d/'+encodeURIComponent(id)+'/preview'}
   else{el=document.createElement('video');el.controls=true;el.autoplay=true;el.playsInline=true;el.src=url}
 }else{
   const id=driveId(url);location.replace(id?'https://drive.google.com/file/d/'+encodeURIComponent(id)+'/view':url);return;
 }
 host.innerHTML='';host.appendChild(el);
})();
</script>
</body>
</html>
