<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Resources | BrightAce Academy</title><link rel="stylesheet" href="../css/style.css"><script src="../js/brightace-api-config.js"></script></head><body><header class="nav"><div class="container nav-inner"><a class="brand" href="../index.html"><img src="../assets/brightace-logo.webp" alt="BrightAce Academy logo"><div class="brand-text"><div class="brand-name"><span class="bright">Bright</span><span class="ace">Ace</span></div><div class="brand-sub">ACADEMY</div></div></a><nav class="nav-links" id="siteNav"><a href="../index.html">Home</a><a href="resources.html">Resources</a><a href="client-dashboard.html">Dashboard</a><a href="chat.html">Live Chat</a></nav></div></header><main><section class="page-hero"><div class="container"><div class="eyebrow">YOUR PURCHASES</div><h1>My Resources</h1><p>Resources you have purchased through your verified BrightAce account.</p></div></section><section class="section"><div class="container"><div id="notice" class="chat-notice" hidden></div><div id="summary" class="payment-detail-grid" style="margin-bottom:18px"></div><div class="card" style="padding:16px;margin-bottom:18px"><div class="dashboard-toolbar" style="margin:0"><input id="resourceSearch" type="search" placeholder="Search your resources…" style="flex:1;min-width:220px"><select id="resourceCategory" style="min-width:170px"><option value="">All categories</option></select><select id="resourceSort" style="min-width:150px"><option value="recent">Most recent</option><option value="name">Name A–Z</option></select><a class="btn btn-outline" href="resources.html">＋ BROWSE RESOURCES</a></div></div><div id="grid" class="resource-grid"><article class="resource-card"><h3>Loading your resources…</h3></article></div></div></section></main><script src="../js/app.js" defer></script><script>(function(){const API=window.BRIGHTACE_API_URL||'',grid=document.getElementById('grid'),notice=document.getElementById('notice');const KEY='brightace_client_session_v4';function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}function session(){try{return JSON.parse(localStorage.getItem(KEY)||sessionStorage.getItem(KEY)||'null')}catch(e){return null}}function note(t,type){notice.textContent=t;notice.className='chat-notice '+type;notice.hidden=!t}async function load(){const s=session();if(!s?.verified||!s.clientSessionToken||!s.phone){note('Your verified BrightAce client session is required. Return to Live Chat to verify your WhatsApp number.','warning');grid.innerHTML='<article class="resource-card"><h3>Secure access required</h3><p><a href="chat.html">RETURN TO LIVE CHAT →</a></p></article>';return}try{const u=new URL(API);u.searchParams.set('action','clientResourceLibrary');u.searchParams.set('clientSessionToken',s.clientSessionToken);u.searchParams.set('phone',s.phone);const r=await fetch(u,{cache:'no-store'}),d=await r.json();if(!d.ok)throw Error(d.error||'Unable to load your resources.');const items=d.resources||[];grid.innerHTML=items.length?items.map(x=>`<article class="resource-card"><div class="resource-thumb">${x.thumbnailUrl?`<img src="${esc(x.thumbnailUrl)}" alt="${esc(x.title)}" loading="lazy">`:'<div class="resource-thumb-fallback">📚</div>'}</div><span class="resource-tag">${esc(x.category||'Resource')}</span><h3>${esc(x.title)}</h3><p>${esc(x.description||'BrightAce resource.')}</p><p><small>Purchased ${x.purchasedAt?new Date(x.purchasedAt).toLocaleDateString():'—'} · ${x.expiresAt?('Access expires '+new Date(x.expiresAt).toLocaleDateString()):'Unlimited access'}</small></p><a class="btn btn-primary" href="javascript:void(0)" data-open="${esc(x.purchaseId)}">OPEN RESOURCE →</a></article>`).join(''):'<article class="resource-card"><h3>No purchased resources yet</h3><p>Browse the BrightAce Resources page to find available study materials.</p><p><a class="btn btn-primary" href="resources.html">BROWSE RESOURCES →</a></p></article>';grid.querySelectorAll('[data-open]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const body=new URLSearchParams();body.set('payload',JSON.stringify({action:'clientResourceAccess',purchaseId:b.dataset.open,clientSessionToken:s.clientSessionToken,phone:s.phone,userAgent:navigator.userAgent}));const r=await fetch(API,{method:'POST',body}),d=await r.json();if(!d.ok)throw Error(d.error||'Resource access failed.');window.open(d.downloadUrl,'_blank','noopener');}catch(e){note(e.message,'error')}finally{b.disabled=false}})}catch(e){if(/session|verify|expired/i.test(e.message||'')){note('Your verified session has expired. Return to Live Chat to verify again.','warning')}else note(e.message,'error')}}load()})();</script><script src="../js/app.js" defer></script><script>(function(){const API=window.BRIGHTACE_API_URL||'',grid=document.getElementById('grid'),notice=document.getElementById('notice'),summary=document.getElementById('summary'),search=document.getElementById('resourceSearch'),category=document.getElementById('resourceCategory'),sort=document.getElementById('resourceSort');const KEY='brightace_client_session_v4';let items=[];function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}function session(){try{return JSON.parse(localStorage.getItem(KEY)||sessionStorage.getItem(KEY)||'null')}catch(e){return null}}function note(t,type){notice.textContent=t;notice.className='chat-notice '+(type||'info');notice.hidden=!t}function render(){let out=items.filter(x=>{const q=search.value.trim().toLowerCase();return(!q||[x.title,x.category,x.description].join(' ').toLowerCase().includes(q))&&(!category.value||x.category===category.value)});out.sort((a,b)=>sort.value==='name'?String(a.title).localeCompare(String(b.title)):new Date(b.purchasedAt||0)-new Date(a.purchasedAt||0));if(!out.length){grid.innerHTML='<article class="resource-card"><h3>No matching purchases</h3><p>Browse the resource catalog to find more study materials.</p><p><a class="btn btn-primary" href="resources.html">BROWSE RESOURCES →</a></p></article>';return;}grid.innerHTML=out.map(x=>`<article class="resource-card"><div class="resource-thumb">${x.thumbnailUrl?`<img src="${esc(x.thumbnailUrl)}" alt="${esc(x.title)}" loading="lazy">`:'<div class="resource-thumb-fallback">📚</div>'}</div><span class="resource-tag">${esc(x.category||'Resource')}</span><h3>${esc(x.title)}</h3><p>${esc(x.description||'BrightAce academic resource.')}</p><p><small>Purchased ${x.purchasedAt?new Date(x.purchasedAt).toLocaleDateString():'—'} · ${x.expiresAt?('Access expires '+new Date(x.expiresAt).toLocaleDateString()):'Unlimited access'} · ${esc(x.fileName||'Digital resource')}</small></p><a class="btn btn-primary" href="javascript:void(0)" data-open="${esc(x.purchaseId)}">OPEN RESOURCE →</a></article>`).join('');grid.querySelectorAll('[data-open]').forEach(b=>b.onclick=async()=>{const s=session();b.disabled=true;try{const body=new URLSearchParams();body.set('payload',JSON.stringify({action:'clientResourceAccess',purchaseId:b.dataset.open,clientSessionToken:s.clientSessionToken,phone:s.phone,userAgent:navigator.userAgent}));const r=await fetch(API,{method:'POST',body});const d=await r.json();if(!d.ok)throw Error(d.error||'Resource access failed.');window.open(d.downloadUrl,'_blank','noopener');}catch(e){note(e.message,'error')}finally{b.disabled=false}})}async function load(){const s=session();if(!s?.verified||!s.clientSessionToken||!s.phone){note('Your verified BrightAce client session is required. Return to Live Chat to verify your WhatsApp number.','warning');grid.innerHTML='<article class="resource-card"><h3>Secure access required</h3><p><a href="chat.html">RETURN TO LIVE CHAT →</a></p></article>';summary.innerHTML='';return;}try{const u=new URL(API);u.searchParams.set('action','clientResourceLibrary');u.searchParams.set('clientSessionToken',s.clientSessionToken);u.searchParams.set('phone',s.phone);const r=await fetch(u,{cache:'no-store'}),d=await r.json();if(!d.ok)throw Error(d.error||'Unable to load your resources.');items=d.resources||[];const cats=[...new Set(items.map(x=>String(x.category||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));category.innerHTML='<option value="">All categories</option>'+cats.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');summary.innerHTML='<div><span>Purchased resources</span><strong>'+items.length+'</strong></div><div><span>Active access</span><strong>'+items.filter(x=>x.accessStatus==='ACTIVE').length+'</strong></div><div><span>Library status</span><strong>VERIFIED</strong></div>';render();}catch(e){if(/session|verify|expired/i.test(e.message||''))note('Your verified session has expired. Return to Live Chat to verify again.','warning');else note(e.message,'error')}}search.oninput=render;category.onchange=render;sort.onchange=render;load()})();</script>
</body></html>
